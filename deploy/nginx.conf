# =============================================================================
# AI Agent 随身导师 · Nginx 配置
# 放置：/etc/nginx/conf.d/ai-agent-mentor.conf
# 使用：把 dist/ 目录内容放到 /var/www/ai-agent-mentor/
#       sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json
           application/manifest+json image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name ai.yourdomain.com;          # ← 改成你的域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.yourdomain.com;          # ← 改成你的域名

    ssl_certificate     /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/ai-agent-mentor;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header Service-Worker-Allowed /;

    charset utf-8;

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 应用外壳：不缓存，保证发版后用户立刻拿到新版 ----
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /sw.js                 { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest  { add_header Cache-Control "no-cache"; }

    # ---- 静态资源：可缓存；更新时记得把 sw.js 里 CACHE 版本号 +1 ----
    location ~* \.(?:js|css|png|jpg|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(?:json|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    access_log /var/log/nginx/aam.access.log;
    error_log  /var/log/nginx/aam.error.log;
}
